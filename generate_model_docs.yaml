# Model docs generation configuration
# Defines the priority models to generate in "some" mode

# Priority models to generate in "some" mode (submodules auto-discovered)
priority_models:
  - auto
  - bert
  - gpt2
  - distilbert
  - bart
  - t5
  - llama
  - mistral
  - gemma
  - gemma3
  - gemma3n
  - whisper
  - clip
  - vit
  - exaone4

# Modules to skip because of known issues
skip_modules:
  - deprecated
  - __pycache__
  - test_modules
  - __init__.py
  - .pyc
  - .pyo
  - .git
